services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doubloon
      POSTGRES_PASSWORD: doubloon
      POSTGRES_DB: doubloon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - doubloon-postgres:/var/lib/postgresql/data

volumes:
  doubloon-postgres:
