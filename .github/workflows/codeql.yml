name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Catches new CodeQL query/advisory coverage against unchanged code —
    # a scan only on push/PR would miss a vulnerability class CodeQL starts
    # detecting after the code that has it was last touched.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
